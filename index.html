<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Mahlet 🌍</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Account Modal Overlay */
        #auth-modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; }
        .auth-card { background: #1e1e1e; padding: 25px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .auth-card h3 { margin-top: 0; color: #fff; text-align: center; }
        .auth-input { background: #333; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .auth-btn { background: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .auth-btn:hover { background: #0056b3; }

        /* Sidebar Menu Styles */
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #181818; box-shadow: 4px 0 10px rgba(0,0,0,0.7); transition: left 0.3s ease; z-index: 1000; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sidebar-title { font-size: 18px; font-weight: bold; }
        .close-sidebar { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        /* Search Box in Sidebar */
        .search-box { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 5px; font-size: 13px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        
        .sidebar-nav { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .sidebar-item { background: #222; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #ddd; text-align: left; border: none; width: 100%; }
        .sidebar-item:hover { background: #333; }
        .recents-header { font-size: 12px; color: #888; margin-top: 5px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Settings Section inside Sidebar */
        .sidebar-settings-section { background: #222; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; color: #ccc; line-height: 1.4; border: 1px solid #333; }
        .sidebar-footer { padding-top: 10px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #ccc; }

        /* Main Chat Container */
        .chat-container { width: 90%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 92vh; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .menu-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .top-btn { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .top-btn:hover { background: #444; }
        
        .temp-toggle-area { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #bbb; }
        .temp-checkbox { cursor: pointer; width: 15px; height: 15px; }

        .controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; font-size: 13px; background: #252525; padding: 8px; border-radius: 6px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 5px; width: 60%; font-size: 12px; }
        
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 5px; background: #2a2a2a; white-space: pre-wrap; line-height: 1.4; font-size: 14px; }
        
        .input-area { display: flex; flex-direction: column; gap: 6px; }
        .input-row { display: flex; gap: 6px; align-items: center; }
        input[type="text"]#user-input { flex: 1; padding: 10px; border: 1px solid #444; background: #333; color: #fff; border-radius: 5px; font-size: 14px; }
        .action-btn { background: #444; padding: 9px 11px; border-radius: 5px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; border: none; color: white; }
        .action-btn:hover { background: #555; }
        #mic-btn.listening { background: #dc3545; animation: pulse 1.5s infinite; }
        #record-btn.recording { background: #dc3545; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        input[type="file"] { display: none; }
        .send-btn { padding: 10px 14px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .send-btn:hover { background: #0056b3; }
        #file-indicator { font-size: 11px; color: #aaa; }
    </style>
</head>
<body>

    <!-- Account Registration Modal (Includes Email & Fast Entry) -->
    <div id="auth-modal">
        <div class="auth-card">
            <h3>Welcome to Global AI Mahlet</h3>
            <p style="font-size: 12px; color: #aaa; margin: 0;">Create your profile to start instantly.</p>
            <input type="text" id="reg-name" class="auth-input" placeholder="Your Name">
            <input type="email" id="reg-email" class="auth-input" placeholder="Your Email Address">
            <input type="number" id="reg-age" class="auth-input" placeholder="Your Age">
            <select id="reg-sex" class="auth-input" style="width:100%;">
                <option value="">Select Sex / Gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
            </select>
            <button class="auth-btn" onclick="registerUser()">Create Account & Start</button>
        </div>
    </div>

    <!-- Slide-out Sidebar (3 Lines Menu + Settings Section) -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title" id="sidebar-username">Global AI</span>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        
        <!-- Settings Section built directly inside the menu -->
        <div class="sidebar-settings-section">
            <div style="font-weight: bold; margin-bottom: 4px; color: #fff;">⚙️ Account Settings</div>
            <div id="sidebar-profile-info">Loading profile...</div>
        </div>

        <!-- Search Box for Recent Chats -->
        <input type="text" id="search-recents" class="search-box" placeholder="Search recent chats..." oninput="filterRecents()">

        <div class="sidebar-nav">
            <button class="sidebar-item" onclick="startNewChat(); toggleSidebar();">＋ New Chat</button>
            <div class="recents-header">Recent Chats</div>
            <div id="recents-list" style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 12px; color: #666;" id="no-recents-text">No recent chats yet</span>
            </div>
        </div>
        
        <div class="sidebar-footer">
            <div onclick="deleteAccount()" style="cursor: pointer; color: #dc3545;">🗑️ Delete Account & Reset</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="menu-btn" onclick="toggleSidebar()" title="Menu">☰</button>
                <h2 style="margin:0; font-size: 18px;">Global AI Mahlet 🌍</h2>
            </div>
            <button class="top-btn" onclick="startNewChat()">＋ New Chat</button>
        </div>

        <div class="top-bar" style="margin-bottom: 6px;">
            <div class="temp-toggle-area">
                <input type="checkbox" id="temp-chat-toggle" class="temp-checkbox" onchange="toggleTempChatMode()">
                <label for="temp-chat-toggle">Temporary Chat Mode</label>
            </div>
            <span id="saved-chats-badge" style="font-size: 11px; color: #888;">Saved Chats: 0</span>
        </div>
        
        <div class="controls">
            <div class="control-row">
                <label for="mode-select">AI Role:</label>
                <select id="mode-select">
                    <option value="coach">❤️ Personal Coach & Stress Motivator</option>
                    <option value="mentor">📚 Academic & Technical Mentor</option>
                    <option value="business">💼 Business Strategist (B2B & B2C)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="lang-select">Language:</label>
                <select id="lang-select">
                    <option value="Auto-Detect (Match My Keyboard)">🌍 Auto-Detect (Match Keyboard)</option>
                    <option value="Amharic (አማርኛ)">Amharic (አማርኛ)</option>
                    <option value="Afaan Oromoo">Afaan Oromoo</option>
                    <option value="Tigrinya (ትግርኛ)">Tigrinya (ትግርኛ)</option>
                    <option value="Somali (Soomaaliga)">Somali (Soomaaliga)</option>
                    <option value="English">English</option>
                    <option value="Spanish (Español)">Spanish (Español)</option>
                    <option value="French (Français)">French (Français)</option>
                    <option value="Arabic (العربية)">Arabic (العربية)</option>
                    <option value="Mandarin Chinese (中文)">Mandarin Chinese (中文)</option>
                    <option value="Hindi (हिन्दी)">Hindi (हिन्दी)</option>
                    <option value="Swahili (Kiswahili)">Swahili (Kiswahili)</option>
                    <option value="German (Deutsch)">German (Deutsch)</option>
                    <option value="Portuguese (Português)">Portuguese (Português)</option>
                    <option value="Japanese (日本語)">Japanese (日本語)</option>
                    <option value="Russian (Русский)">Russian (Русский)</option>
                    <option value="Italian (Italiano)">Italian (Italiano)</option>
                    <option value="Turkish (Türkçe)">Turkish (Türkçe)</option>
                    <option value="Korean (한국어)">Korean (한국어)</option>
                    <option value="Vietnamese (Tiếng Việt)">Vietnamese (Tiếng Việt)</option>
                    <option value="Polish (Polski)">Polish (Polski)</option>
                    <option value="Dutch (Nederlands)">Dutch (Nederlands)</option>
                    <option value="Greek (Ελληνικά)">Greek (Ελληνικά)</option>
                    <option value="Hebrew (עברית)">Hebrew (עברית)</option>
                    <option value="Persian (فارسی)">Persian (فارسی)</option>
                    <option value="Urdu (اردو)">Urdu (Urdu)</option>
                    <option value="Bengali (বাংলা)">Bengali (বাংলা)</option>
                    <option value="Punjabi (ਪੰਜਾਬੀ)">Punjabi</option>
                    <option value="Marathi (मराठी)">Marathi</option>
                    <option value="Telugu (తెలుగు)">Telugu</option>
                    <option value="Tamil (தமிழ்)">Tamil</option>
                    <option value="Gujarati (ગુજરાતી)">Gujarati</option>
                    <option value="Kannada (ಕನ್ನಡ)">Kannada</option>
                    <option value="Malayalam (മലയാളം)">Malayalam</option>
                    <option value="Thai (ไทย)">Thai</option>
                    <option value="Indonesian (Bahasa Indonesia)">Indonesian</option>
                    <option value="Malay (Bahasa Melayu)">Malay</option>
                    <option value="Filipino (Tagalog)">Filipino</option>
                    <option value="Ukrainian (Українська)">Ukrainian</option>
                    <option value="Romanian (Română)">Romanian</option>
                    <option value="Czech (Čeština)">Czech</option>
                    <option value="Hungarian (Magyar)">Hungarian</option>
                    <option value="Swedish (Svenska)">Swedish</option>
                    <option value="Danish (Dansk)">Dansk</option>
                    <option value="Finnish (Suomi)">Finnish</option>
                    <option value="Norwegian (Norsk)">Norwegian</option>
                    <option value="Afrikaans">Afrikaans</option>
                    <option value="Zulu (isiZulu)">Zulu</option>
                    <option value="Xhosa (isiXhosa)">Xhosa</option>
                    <option value="Hausa">Hausa</option>
                    <option value="Yoruba (Yorùbá)">Yoruba</option>
                    <option value="Igbo">Igbo</option>
                    <option value="Shona">Shona</option>
                    <option value="Quechua">Quechua</option>
                    <option value="Esperanto">Esperanto</option>
                    <option value="Latin">Latin</option>
                </select>
            </div>
        </div>

        <div id="chat-box">AI response will appear here... All features loaded!</div>
        
        <div class="input-area">
            <div id="file-indicator">No file attached</div>
            <div class="input-row">
                <label class="action-btn" for="file-input" title="Camera or File">📷</label>
                <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFileSelect()" />
                
                <button class="action-btn" id="record-btn" onclick="toggleAudioRecording()" title="Record Voice Note">🎙️</button>
                <button class="action-btn" id="mic-btn" onclick="toggleVoiceMode()" title="Live Voice Mode">🎤</button>
                <button class="action-btn" onclick="toggleSpeakerSpeech()" title="Read Aloud / Stop Speaker">🔊</button>
                
                <input type="text" id="user-input" placeholder="Type a message..." />
                <button class="send-btn" onclick="sendTextMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let selectedFileBase64 = null;
        let chatHistory = [];
        let savedChatsList = [];
        let lastAiText = "";
        let isVoiceMode = false;
        let isTempChat = false;
        let recognition = null;
        let isAiSpeaking = false;
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Instant account check on load
        window.onload = function() {
            const userProfile = localStorage.getItem('mahlet_user_profile');
            if (userProfile) {
                const profile = JSON.parse(userProfile);
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('sidebar-username').innerText = profile.name;
                document.getElementById('sidebar-profile-info').innerHTML = `Name: ${profile.name}<br>Email: ${profile.email}<br>Age: ${profile.age} | Sex: ${profile.sex}`;
            } else {
                document.getElementById('auth-modal').style.display = 'flex';
            }
        };

        // Instant Registration Function (No lagging)
        function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const age = document.getElementById('reg-age').value.trim();
            const sex = document.getElementById('reg-sex').value;

            if (!name || !email || !age || !sex) {
                alert("Please fill in all fields (Name, Email, Age, Sex).");
                return;
            }

            const profile = { name, email, age, sex };
            localStorage.setItem('mahlet_user_profile', JSON.stringify(profile));
            
            // Instantly hide modal and populate sidebar settings
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('sidebar-username').innerText = name;
            document.getElementById('sidebar-profile-info').innerHTML = `Name: ${name}<br>Email: ${email}<br>Age: ${age} | Sex: ${sex}`;
        }

        function deleteAccount() {
            if (confirm("Are you sure you want to delete your account? All settings and saved chats will be cleared.")) {
                localStorage.removeItem('mahlet_user_profile');
                location.reload();
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function filterRecents() {
            const query = document.getElementById('search-recents').value.toLowerCase();
            const recentsContainer = document.getElementById('recents-list');
            recentsContainer.innerHTML = '';
            
            const filtered = savedChatsList.filter(chat => chat.title.toLowerCase().includes(query));
            
            if (filtered.length === 0) {
                recentsContainer.innerHTML = '<span style="font-size: 12px; color: #666;">No matching chats</span>';
                return;
            }

            filtered.forEach((chat) => {
                const originalIndex = savedChatsList.indexOf(chat);
                const btn = document.createElement('button');
                btn.className = 'sidebar-item recents-item-btn';
                btn.innerText = chat.title;
                btn.onclick = () => loadRecentChat(originalIndex);
                recentsContainer.appendChild(btn);
            });
        }

        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            const indicator = document.getElementById('file-indicator');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                indicator.innerText = `Compressing ${file.name}...`;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        selectedFileBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        indicator.innerText = `Attached: ${file.name} (Ready)`;
                    };
                };
                reader.readAsDataURL(file);
            } else {
                indicator.innerText = "N

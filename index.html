<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI 🌍</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #ffffff; color: #111; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; min-height: 100dvh; margin: 0; padding: 10px; 
        }
        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: #f9f9f9; box-shadow: 4px 0 15px rgba(0,0,0,0.1); transition: left 0.3s ease; z-index: 1000; display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #e5e5e5; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 16px; }
        .close-sidebar { background: none; border: none; color: #333; font-size: 18px; cursor: pointer; }
        
        .menu-category { font-size: 13px; padding: 8px 0; color: #333; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .menu-category:hover { background: #eee; border-radius: 6px; padding-left: 5px; }
        
        .recents-title { font-size: 12px; font-weight: bold; color: #777; margin: 15px 0 5px 0; text-transform: uppercase; }
        .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .history-item { padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background: #eaeaea; }

        /* Context Popup Menu */
        .context-menu { position: absolute; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 12px; width: 160px; display: none; z-index: 2000; padding: 6px; border: 1px solid #ddd; }
        .context-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 6px; color: #333; display: flex; align-items: center; gap: 8px; }
        .context-item:hover { background: #f0f0f0; }
        .context-item.delete { color: #ef4444; }

        .chat-container { width: 100%; max-width: 650px; background: #fff; padding: 10px; display: flex; flex-direction: column; height: 90vh; border-radius: 12px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .menu-btn, .top-btn, .temp-icon-btn { background: none; border: 1px solid #ddd; padding: 6px 10px; border-radius: 20px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .top-icons { display: flex; gap: 8px; align-items: center; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 8px; font-size: 12px; background: #f4f4f5; padding: 8px; border-radius: 8px; }
        select { background: #fff; color: #333; border: 1px solid #ccc; padding: 4px; border-radius: 6px; width: 100%; font-size: 12px; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; line-height: 1.5; font-size: 14px; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #f4f4f5; color: #111; }
        .message.ai { align-self: flex-start; background: transparent; color: #111; }
        .message-header { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #666; }
        
        .input-area { display: flex; flex-direction: column; gap: 6px; }
        .file-indicator { font-size: 11px; color: #2563eb; padding-left: 4px; }
        .input-row { display: flex; gap: 6px; align-items: center; background: #f4f4f5; padding: 8px 12px; border-radius: 24px; border: 1px solid #e5e5e5; }
        input[type="text"]#user-input { flex: 1; padding: 6px; border: none; background: transparent; color: #111; font-size: 14px; outline: none; }
        
        .action-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; }
        .send-btn { background: #2563eb; color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Sidebar Styled Like ChatGPT -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>Global AI</span>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        
        <div class="menu-category" onclick="alert('Opening Images...')">🖼️ Images</div>
        <div class="menu-category" onclick="alert('Opening Library...')">📚 Library</div>
        <div class="menu-category" onclick="alert('Opening Projects...')">📁 Projects</div>
        <div class="menu-category" onclick="alert('Opening Scheduled...')">⏰ Scheduled</div>
        <div class="menu-category" onclick="alert('Opening Plugins...')">🔌 Plugins</div>

        <div class="recents-title">Recents</div>
        <div id="history-list" class="chat-history-list">
            <!-- Populated via script -->
        </div>
    </div>

    <!-- Context Popup Menu (Pin, Rename, Delete) -->
    <div id="contextMenu" class="context-menu">
        <div class="context-item" onclick="handleContextAction('pin')">📌 Pin chat</div>
        <div class="context-item" onclick="handleContextAction('rename')">✏️ Rename</div>
        <div class="context-item delete" onclick="handleContextAction('delete')">🗑️ Delete</div>
    </div>

    <div class="chat-container">
        <div class="top-bar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h2 style="margin:0; font-size: 16px; font-weight: 600;">Global AI</h2>
            <div class="top-icons">
                <!-- Temporary Chat Icon outside menu -->
                <button class="temp-icon-btn" id="tempChatBtn" title="Toggle Temporary Chat" onclick="toggleTemporaryChat()">⏳</button>
                <button class="top-btn" onclick="startNewChat()">✏️</button>
            </div>
        </div>
        
        <div class="controls">
            <select id="mode-select">
                <option value="coach">❤️ Supportive Companion</option>
                <option value="mentor">📚 Academic Mentor</option>
                <option value="expert">💡 Professional Expert</option>
            </select>
            <select id="lang-select">
                <option value="English">English</option>
                <option value="Amharic">Amharic</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="Arabic">Arabic</option>
            </select>
        </div>

        <div id="chat-box">
            <div class="message ai">
                <div class="message-header">Global AI</div>
                Hello! I am ready. What would you like to discuss or work on today?
            </div>
        </div>
        
        <div class="input-area">
            <div id="file-indicator" class="file-indicator"></div>
            <div class="input-row">
                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelection(event)" />
                
                <button class="action-btn" title="Upload Image" onclick="triggerFileUpload('image/*')">➕</button>
                <input type="text" id="user-input" placeholder="Ask Global AI..." onkeydown="if(event.key === 'Enter') sendTextMessage();" />
                <button class="action-btn" title="Voice Input" onclick="toggleVoiceInput()">🎙️</button>
                <button class="send-btn" onclick="sendTextMessage()">⬆</button>
            </div>
        </div>
    </div>

    <script>
        let attachedFile = null;
        let isTempChatActive = false;
        let chatHistoryData = [
            "Add Workers AI Binding",
            "Published AI Website",
            "Scholarship Testing Prep",
            "Ethiopian New Year"
        ];
        let selectedChatIndex = null;

        renderHistoryList();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            closeContextMenu();
        }

        function toggleTemporaryChat() {
            isTempChatActive = !isTempChatActive;
            const btn = document.getElementById('tempChatBtn');
            if (isTempChatActive) {
                btn.style.background = '#e0f2fe';
                btn.style.borderColor = '#0284c7';
                alert("Temporary Chat Enabled: History will not be saved for this session.");
            } else {
                btn.style.background = 'none';
                btn.style.borderColor = '#ddd';
                alert("Temporary Chat Disabled.");
            }
        }

        function startNewChat() {
            document.getElementById('chat-box').innerHTML = '<div class="message ai"><div class="message-header">Global AI</div>New chat started! How can I help you today?</div>';
            clearAttachment();
        }

        function renderHistoryList() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            chatHistoryData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>${item}</span> <span style="color:#888; font-size:16px;" onclick="openContextMenu(event, ${index})">•••</span>`;
                div.onclick = (e) => {
                    if(e.target.tagName !== 'SPAN' || e.target.innerText !== '•••') {
                        loadChat(item);
                    }
                };
                listEl.appendChild(div);
            });
        }

        function openContextMenu(event, index) {
            event.stopPropagation();
            selectedChatIndex = index;
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.top = `${event.clientY}px`;
            menu.style.left = `${Math.min(event.clientX, 150)}px`;
        }

        function closeContextMenu() {
            document.getElementById('contextMenu').style.display = 'none';
        }

        window.onclick = function() { closeContextMenu(); }

        function handleContextAction(action) {
            if (selectedChatIndex === null) return;
            const chatName = chatHistoryData[selectedChatIndex];
            if (action === 'pin') {
                alert(`Pinned: ${chatName}`);
            } else if (action === 'rename') {
                const newName = prompt("Rename chat to:", chatName);
                if (newName) {
                    chatHistoryData[selectedChatIndex] = newName;
                    renderHistoryList();
                }
            } else if (action === 'delete') {
                chatHistoryData.splice(selectedChatIndex, 1);
                renderHistoryList();
            }
            closeContextMenu();
        }

        function loadChat(title) {
            toggleSidebar();
            document.getElementById('chat-box').innerHTML = `<div class="message ai"><div class="message-header">Global AI</div>Loaded chat: ${title}</div>`;
        }

        function triggerFileUpload(acceptType) {
            const fileInput = document.getElementById('file-input');
            fileInput.accept = acceptType;
            fileInput.click();
        }

        function handleFileSelection(event) {
            const file = event.target.files[0];
            if (file) {
                attachedFile = file;
                document.getElementById('file-indicator').innerText = `Attached: ${file.name}`;
            }
        }

        function clearAttachment() {
            attachedFile = null;
            document.getElementById('file-indicator').innerText = '';
            document.getElementById('file-input').value = '';
        }

        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Voice input is not supported on this browser.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.onresult = (event) => {
                document.getElementById('user-input').value = event.results[0][0].transcript;
            };
            recognition.start();
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function sendTextMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const modeSelect = document.getElementById('mode-select').value;
            const langSelect = document.getElementById('lang-select').value;
            const prompt = inputField.value.trim();
            
            if (!prompt && !attachedFile) return;

            if (!isTempChatActive && prompt) {
                chatHistoryData.unshift(prompt.slice(0, 25));
                renderHistoryList();
            }

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerHTML = `<div class="message-header">You</div>${prompt}`;
            chatBox.appendChild(userDiv);
            
            inputField.value = '';
            clearAttachment();
            chatBox.scrollTop = chatBox.scrollHeight;

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            aiDiv.innerHTML = `<div class="message-header">Global AI</div>Thinking...`;
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }],
                        mode: modeSelect,
                        language: langSelect
                    })
                });

                const data = await response.json();
                const replyText = data.reply || data.error || "Done!";
                aiDiv.innerHTML = `<div class="message-header">Global AI</div>${replyText}`;
                speakText(replyText);
            } catch (err) {
                const fallbackText = `I received your message: "${prompt}". (API connection active)`;
                aiDiv.innerHTML = `<div class="message-header">Global AI</div>${fallbackText}`;
                speakText(fallbackText);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

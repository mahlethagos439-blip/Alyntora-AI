<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Mahlet 🌍</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 90%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 8px; margin-top: 20px; flex: 1; max-height: 85vh; }
        .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; font-size: 13px; background: #252525; padding: 10px; border-radius: 8px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 5px; width: 60%; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #181818; display: flex; flex-direction: column; gap: 10px; }
        .input-area { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #444; background: #333; color: #fff; border-radius: 5px; outline: none; }
        .send-btn { background: #007bff; color: white; border: none; border-radius: 5px; padding: 12px 18px; cursor: pointer; font-size: 13px; }
        .send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>Global AI Mahlet 🌍</h2>
        
        <div class="controls">
            <div class="control-row">
                <label for="node-select">AI Role:</label>
                <select id="node-select">
                    <option value="coach">❤️ Personal Coach & Stress Motivator</option>
                    <option value="mentor">🎓 Academic & Technical Mentor</option>
                    <option value="business">💼 Business Strategist</option>
                </select>
            </div>
        </div>

        <div id="chat-box">
            <div>AI response will appear here... Type your message below!</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button class="send-btn" id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const nodeSelect = document.getElementById('node-select');

        function handleSend() {
            const rawText = userInput.value.trim();
            if (!rawText) return;

            // Display user message
            chatBox.innerHTML += `<div><b>You:</b> ${rawText}</div>`;
            userInput.value = '';

            // Smart keyword matching (handles typos like 'hii' or missing words)
            const text = rawText.toLowerCase();
            let reply = "";

            setTimeout(() => {
                const role = nodeSelect.value;

                if (text.includes('hi') || text.includes('hii') || text.includes('hey') || text.includes('hello')) {
                    reply = "Hello there! How can I support you today?";
                } else if (text.includes('problem') || text.includes('issue') || text.includes('error') || text.includes('mistake')) {
                    reply = "I understand you're facing a hurdle. Let's look at it step-by-step to figure it out together!";
                } else if (text.includes('name') || text.includes('who are you')) {
                    reply = "I am Global AI Mahlet, your browser assistant ready to help you solve problems.";
                } else {
                    // Fallback varied smart responses
                    const variedReplies = [
                        "That is an interesting point. Can you tell me a little more about what you want to achieve?",
                        "I'm tracking with you. Let's break down your question to find the best approach.",
                        "Got it! How would you like to proceed with this next?"
                    ];
                    reply = variedReplies[Math.floor(Math.random() * variedReplies.length)];
                }

                chatBox.innerHTML += `<div><b>AI (${role}):</b> ${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>

<h1>Global AI Mahlet</h1>
<div style="margin-top: 20px;">
  <input type="text" id="chatInput" placeholder="Type your message here..." style="padding: 10px; width: 70%; max-width: 400px;" />
  <button style="padding: 10px 20px;">Send</button>
</div>
<div style="margin-top: 15px;">
  <input type="file" id="fileInput" accept="image/*,.pdf,.txt" style="padding: 10px;" />
</div>
<div style="margin-top: 15px;">
  <button style="padding: 10px 20px; background-color: #f0f0f0; border: 1px solid #ccc; cursor: pointer;">🎤 Record Voice</button>
</div>
<div style="margin-top: 20px; padding: 15px; border: 1px solid #ddd; min-height: 100px; max-width: 500px; background-color: #f9f9f9;">
  <p style="color: #666; margin: 0;">AI response will appear here...</p>
</div>

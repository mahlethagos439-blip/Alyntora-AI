<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global AI Mahlet 🌍</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .app {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      color: #6b7280;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      padding: 13px 16px;
      border-radius: 15px;
      max-width: 80%;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
    }

    .assistant {
      margin-right: auto;
      background: white;
      border: 1px solid #e5e7eb;
    }

    .input-area {
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    #send {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    #send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      padding: 5px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Global AI Mahlet 🌍</h1>
    <p>Your AI assistant</p>
  </header>

  <div id="chat">
    <div class="message assistant">
      Hello! 👋 I am Global AI Mahlet. How can I help you today?
    </div>
  </div>

  <div id="status" class="status"></div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button id="send">Send</button>
  </div>

</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("message");
  const sendButton = document.getElementById("send");
  const status = document.getElementById("status");

  const history = [];

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    history.push({
      role: "user",
      content: message
    });

    input.value = "";
    sendButton.disabled = true;
    status.textContent = "Thinking...";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message,
          history: history.slice(-10)
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "AI server error");
      }

      const answer = data.response || "I didn't receive a response.";

      addMessage(answer, "assistant");

      history.push({
        role: "assistant",
        content: answer
      });

      status.textContent = "";

    } catch (error) {

      console.error(error);

      addMessage(
        "⚠️ AI connection error: " + error.message,
        "assistant"
      );

      status.textContent = "";

    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>

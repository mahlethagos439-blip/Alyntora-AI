<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Mahlet 🌍</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 90%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 92vh; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .top-btn { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .top-btn:hover { background: #444; }
        
        .temp-toggle-area { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #bbb; }
        .temp-checkbox { cursor: pointer; width: 15px; height: 15px; }

        .controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; font-size: 13px; background: #252525; padding: 8px; border-radius: 6px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 5px; width: 60%; font-size: 12px; }
        
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 5px; background: #2a2a2a; white-space: pre-wrap; line-height: 1.4; font-size: 14px; }
        
        .input-area { display: flex; flex-direction: column; gap: 6px; }
        .input-row { display: flex; gap: 6px; align-items: center; }
        input[type="text"]#user-input { flex: 1; padding: 10px; border: 1px solid #444; background: #333; color: #fff; border-radius: 5px; font-size: 14px; }
        .action-btn { background: #444; padding: 9px 11px; border-radius: 5px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; border: none; color: white; }
        .action-btn:hover { background: #555; }
        #mic-btn.listening { background: #dc3545; animation: pulse 1.5s infinite; }
        #record-btn.recording { background: #dc3545; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        input[type="file"] { display: none; }
        .send-btn { padding: 10px 14px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .send-btn:hover { background: #0056b3; }
        #file-indicator { font-size: 11px; color: #aaa; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="top-bar">
            <h2 style="margin:0; font-size: 18px;">Global AI Mahlet 🌍</h2>
            <button class="top-btn" onclick="startNewChat()">＋ New Chat</button>
        </div>

        <div class="top-bar" style="margin-bottom: 6px;">
            <div class="temp-toggle-area">
                <input type="checkbox" id="temp-chat-toggle" class="temp-checkbox" onchange="toggleTempChatMode()">
                <label for="temp-chat-toggle">Temporary Chat Mode</label>
            </div>
            <span id="saved-chats-badge" style="font-size: 11px; color: #888;">Saved Chats: 0</span>
        </div>
        
        <div class="controls">
            <div class="control-row">
                <label for="mode-select">AI Role:</label>
                <select id="mode-select">
                    <option value="coach">❤️ Personal Coach & Stress Motivator</option>
                    <option value="mentor">📚 Academic & Technical Mentor</option>
                    <option value="business">💼 Business Strategist (B2B & B2C)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="lang-select">Language:</label>
                <select id="lang-select">
                    <option value="Auto-Detect (Match My Keyboard)">🌍 Auto-Detect (Match Keyboard)</option>
                    <option value="Amharic (አማርኛ)">Amharic (አማርኛ)</option>
                    <option value="Afaan Oromoo">Afaan Oromoo</option>
                    <option value="Tigrinya (ትግርኛ)">Tigrinya (ትግርኛ)</option>
                    <option value="Somali (Soomaaliga)">Somali (Soomaaliga)</option>
                    <option value="English">English</option>
                    <option value="Spanish (Español)">Spanish (Español)</option>
                    <option value="French (Français)">French (Français)</option>
                    <option value="Arabic (العربية)">Arabic (العربية)</option>
                    <option value="Mandarin Chinese (中文)">Mandarin Chinese (中文)</option>
                    <option value="Hindi (हिन्दी)">Hindi (हिन्दी)</option>
                    <option value="Swahili (Kiswahili)">Swahili (Kiswahili)</option>
                    <option value="German (Deutsch)">German (Deutsch)</option>
                    <option value="Portuguese (Português)">Portuguese (Português)</option>
                    <option value="Japanese (日本語)">Japanese (日本語)</option>
                    <option value="Russian (Русский)">Russian (Русский)</option>
                    <option value="Italian (Italiano)">Italian (Italiano)</option>
                    <option value="Turkish (Türkçe)">Turkish (Türkçe)</option>
                    <option value="Korean (한국어)">Korean (한국어)</option>
                    <option value="Vietnamese (Tiếng Việt)">Vietnamese (Tiếng Việt)</option>
                    <option value="Polish (Polski)">Polish (Polski)</option>
                    <option value="Dutch (Nederlands)">Dutch (Nederlands)</option>
                    <option value="Greek (Ελληνικά)">Greek (Ελληνικά)</option>
                    <option value="Hebrew (עברית)">Hebrew (עברית)</option>
                    <option value="Persian (فارسی)">Persian (فارسی)</option>
                    <option value="Urdu (اردو)">Urdu (Urdu)</option>
                    <option value="Bengali (বাংলা)">Bengali (বাংলা)</option>
                    <option value="Punjabi (ਪੰਜਾਬੀ)">Punjabi</option>
                    <option value="Marathi (मराठी)">Marathi</option>
                    <option value="Telugu (తెలుగు)">Telugu</option>
                    <option value="Tamil (தமிழ்)">Tamil</option>
                    <option value="Gujarati (ગુજરાતી)">Gujarati</option>
                    <option value="Kannada (ಕನ್ನಡ)">Kannada</option>
                    <option value="Malayalam (മലയാളം)">Malayalam</option>
                    <option value="Thai (ไทย)">Thai</option>
                    <option value="Indonesian (Bahasa Indonesia)">Indonesian</option>
                    <option value="Malay (Bahasa Melayu)">Malay</option>
                    <option value="Filipino (Tagalog)">Filipino</option>
                    <option value="Ukrainian (Українська)">Ukrainian</option>
                    <option value="Romanian (Română)">Romanian</option>
                    <option value="Czech (Čeština)">Czech</option>
                    <option value="Hungarian (Magyar)">Hungarian</option>
                    <option value="Swedish (Svenska)">Swedish</option>
                    <option value="Danish (Dansk)">Danish</option>
                    <option value="Finnish (Suomi)">Finnish</option>
                    <option value="Norwegian (Norsk)">Norwegian</option>
                    <option value="Afrikaans">Afrikaans</option>
                    <option value="Zulu (isiZulu)">Zulu</option>
                    <option value="Xhosa (isiXhosa)">Xhosa</option>
                    <option value="Hausa">Hausa</option>
                    <option value="Yoruba (Yorùbá)">Yoruba</option>
                    <option value="Igbo">Igbo</option>
                    <option value="Shona">Shona</option>
                    <option value="Quechua">Quechua</option>
                    <option value="Esperanto">Esperanto</option>
                    <option value="Latin">Latin</option>
                </select>
            </div>
        </div>

        <div id="chat-box">AI response will appear here... All features loaded!</div>
        
        <div class="input-area">
            <div id="file-indicator">No file attached</div>
            <div class="input-row">
                <label class="action-btn" for="file-input" title="Camera or File">📷</label>
                <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFileSelect()" />
                
                <button class="action-btn" id="record-btn" onclick="toggleAudioRecording()" title="Record Voice Note">🎙️</button>
                <button class="action-btn" id="mic-btn" onclick="toggleVoiceMode()" title="Live Voice Mode">🎤</button>
                <button class="action-btn" onclick="toggleSpeakerSpeech()" title="Read Aloud / Stop Speaker">🔊</button>
                
                <input type="text" id="user-input" placeholder="Type a message..." />
                <button class="send-btn" onclick="sendTextMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let selectedFileBase64 = null;
        let chatHistory = [];
        let savedChatsList = [];
        let lastAiText = "";
        let isVoiceMode = false;
        let isTempChat = false;
        let recognition = null;
        let isAiSpeaking = false;
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            const indicator = document.getElementById('file-indicator');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                indicator.innerText = `Compressing ${file.name}...`;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        selectedFileBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        indicator.innerText = `Attached: ${file.name} (Ready)`;
                    };
                };
                reader.readAsDataURL(file);
            } else {
                indicator.innerText = "No file attached";
                selectedFileBase64 = null;
            }
        }

        async function toggleAudioRecording() {
            const recordBtn = document.getElementById('record-btn');
            const indicator = document.getElementById('file-indicator');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            selectedFileBase64 = reader.result;
                            indicator.innerText = "Attached: Voice Note (Ready)";
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    indicator.innerText = "Recording voice note... Tap record button again to stop.";
                } catch (err) {
                    alert("Microphone permission denied or unavailable.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        }

        function startNewChat() {
            handleTempChatExitCheck(() => {
                chatHistory = [];
                document.getElementById('chat-box').innerHTML = "New chat started! Ask Mahlet anything.";
                lastAiText = "";
                stopAllSpeech();
            });
        }

        function toggleTempChatMode() {
            const checkbox = document.getElementById('temp-chat-toggle');
            if (!checkbox.checked) {
                handleTempChatExitCheck(() => {
                    isTempChat = false;
                });
            } else {
                isTempChat = true;
            }
        }

        function handleTempChatExitCheck(callback) {
            if (isTempChat && chatHistory.length > 0) {
                const wantSave = confirm("Do you want to save this temporary chat?\n\nOK = Yes | Cancel = No");
                if (wantSave) {
                    savedChatsList.push([...chatHistory]);
                    document.getElementById('saved-chats-badge').innerText = `Saved Chats: ${savedChatsList.length}`;
                }
            }
            callback();
        }

        function stopAllSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            isAiSpeaking = false;
        }

        function toggleVoiceMode() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported on this browser.");
                return;
            }

            const micBtn = document.getElementById('mic-btn');

            if (isVoiceMode) {
                isVoiceMode = false;
                if (recognition) recognition.stop();
                stopAllSpeech();
                micBtn.classList.remove('listening');
                return;
            }

            isVoiceMode = true;
            micBtn.classList.add('listening');
            startListening();
        }

        function startListening() {
            if (!isVoiceMode || isAiSpeaking) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                if (isAiSpeaking) return;
                const speechToText = event.results[0][0].transcript;
                document.getElementById('user-input').value = speechToText;
                sendVoiceMessage();
            };

            recognition.onerror = () => {
                if (isVoiceMode && !isAiSpeaking) setTimeout(startListening, 1000);
            };

            recognition.onend = () => {
                if (isVoiceMode && !isAiSpeaking) setTimeout(startListening, 500);
            };

            try { recognition.start(); } catch (e) {}
        }

        async function sendTextMessage() {
            await processMessage(false);
        }

        async function sendVoiceMessage() {
            await processMessage(true);
        }

        async function processMessage(shouldSpeak) {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const modeSelect = document.getElementById('mode-select');
            const langSelect = document.getElementById('lang-select');
            const prompt = inputField.value.trim();
            
            if (!prompt && !selectedFileBase64) return;

            let displayLabel = prompt || "[Uploaded file/audio]";
            chatBox.innerHTML += `\n\nYou [${modeSelect.value}]: ${displayLabel}`;
            chatHistory.push({ role: 'user', content: prompt || "Please analyze this attached file/audio." });

            inputField.value = '';
            chatBox.innerHTML += `\n\nAI: Thinking...`;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        messages: chatHistory, 
                        mode: modeSelect.value,
                        language: langSelect.value,
                        image: selectedFileBase64 
                    })
                });

                const data = await response.json();
                const aiReply = data.response || data.error;

                chatBox.innerHTML = chatBox.innerHTML.replace('AI: Thinking...', `AI: ${aiReply}`);
                chatHistory.push({ role: 'assistant', content: aiReply });
                lastAiText = aiReply;

                if (shouldSpeak) {
                    speakText(aiReply);
                }

                document.getElementById('file-input').value = '';
                document.getElementById('file-indicator').innerText = "No file attached";
                selectedFileBase64 = null;
            } catch (err) {
                chatBox.innerHTML = chatBox.innerHTML.replace('AI: Thinking...', `AI: Error connecting to server.`);
                if (isVoiceMode) setTimeout(startListening, 1000);
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            isAiSpeaking = true;
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }

            const utterance = new SpeechSynthesisUtterance(text);
            
            utterance.onend = () => {
                isAiSpeaking = false;
                if (isVoiceMode) {
                    setTimeout(startListening, 600);
                }
            };

            utterance.onerror = () => {
                isAiSpeaking = false;
                if (isVoiceMode) {
                    setTimeout(startListening, 600);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // Tap speaker to read aloud, or tap again to instantly stop the voice!
        function toggleSpeakerSpeech() {
            if (isAiSpeaking) {
                stopAllSpeech();
            } else if (lastAiText) {
                speakText(lastAiText);
            }
        }
    </script>
</body>
</html>

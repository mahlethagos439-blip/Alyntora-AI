            padding: 20px;

        .chat-container {

            flex-direction: column;
            gap: 15px;

        .response-box {

            border: 1px solid #333537;

        .input-area {

            border: 1px solid #333537;

            padding: 12px 20px;
            display: flex;
            align-items: center;

        input[type="text"] {

            color: #e3e3e3;
            font-size: 1rem;
            flex-grow: 1;
            outline: none;
        }
        input[type="text"]::placeholder {

        .actions {

        button, label.file-btn {

            color: #e3e3e3;
            border: none;
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }

    <div class="chat-container">
        <!-- AI Response Box -->
        <div class="response-box">
            <p style="margin: 0;">AI response will appear here...</p>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Enter a prompt here...">
            
            <div class="actions">
                <label class="file-btn" for="fileInput">📎</label>
                <input type="file" id="fileInput" accept="image/*,.pdf,.txt">

                <button title="Voice Input">🎤</button>
                <button style="background-color: #8ab4f8; color: #202124; font-weight: 500;">Send</button>

              </html>

<script>
    const chatInput = document.getElementById('chatInput');
    const responseBox = document.querySelector('.response-box p');
    const sendButton = document.querySelector('.actions button:last-child');
    const voiceButton = document.querySelector('.actions button:nth-last-child(2)');

    // 1. Send text and display response
    sendButton.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (text) {
            responseBox.textContent = "Global AI Mahlet is thinking about: " + text;
            chatInput.value = '';
        }
    });

    // 2. Voice Listening (Speech to Text)
    voiceButton.addEventListener('click', () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('languageSelect').value;
            recognition.start();
            
            responseBox.textContent = "Listening... Speak now.";

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                chatInput.value = speechText;
                responseBox.textContent = "Captured voice: " + speechText;
            };

            recognition.onerror = () => {
                responseBox.textContent = "Voice recognition error. Please try again.";
            };
        } else {
            alert("Speech recognition is not supported in this browser.");
        }
    });

    // 3. Voice Response (Text to Speech)
    function speakResponse(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById('languageSelect').value;
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

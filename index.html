<script>
    const chatInput = document.getElementById('chatInput');
    const responseBox = document.querySelector('.response-box p');
    const sendButton = document.querySelector('.actions button:last-child');
    const voiceButton = document.querySelector('.actions button:nth-last-child(2)');

    // 1. Send text and display response
    sendButton.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (text) {
            responseBox.textContent = "Global AI Mahlet is thinking about: " + text;
            chatInput.value = '';
        }
    });

    // 2. Voice Listening (Speech to Text)
    voiceButton.addEventListener('click', () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('languageSelect').value;
            recognition.start();
            
            responseBox.textContent = "Listening... Speak now.";

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                chatInput.value = speechText;
                responseBox.textContent = "Captured voice: " + speechText;
            };

            recognition.onerror = () => {
                responseBox.textContent = "Voice recognition error. Please try again.";
            };
        } else {
            alert("Speech recognition is not supported in this browser.");
        }
    });

    // 3. Voice Response (Text to Speech)
    function speakResponse(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById('languageSelect').value;
            window.speechSynthesis.speak(utterance);
        }
    }
</script>
<script>
    const chatInput = document.getElementById('chatInput');
    const responseBox = document.querySelector('.response-box p');
    const sendButton = document.querySelector('.actions button:last-child');
    const voiceButton = document.querySelector('.actions button:nth-last-child(2)');

    // Load past chat history from browser storage on startup
    window.addEventListener('DOMContentLoaded', () => {
        const savedHistory = localStorage.getItem('mahlet_chat_history');
        if (savedHistory) {
            responseBox.innerHTML = savedHistory;
        }
    });

    // Save and display chat interaction
    sendButton.addEventListener('click', () => {
        const text = chatInput.value.trim();
        if (text) {
            const newMsg = `<br><strong>You:</strong> ${text}<br><strong>AI:</strong> Global AI Mahlet remembers: ${text}`;
            responseBox.innerHTML += newMsg;
            
            // Save to browser memory
            localStorage.setItem('mahlet_chat_history', responseBox.innerHTML);
            chatInput.value = '';
        }
    });

    // Voice Listening (Speech to Text)
    voiceButton.addEventListener('click', () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('languageSelect').value;
            recognition.start();
            
            responseBox.innerHTML += `<br><em>Listening...</em>`;

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                chatInput.value = speechText;
                localStorage.setItem('mahlet_chat_history', responseBox.innerHTML);
            };

            recognition.onerror = () => {
                responseBox.innerHTML += `<br><em>Voice recognition error.</em>`;
            };
        } else {
            alert("Speech recognition is not supported in this browser.");
        }
    });
</script>

<script>
  // Loading Indicator Integration for Chat Send
  const sendButton = document.getElementById('sendButton') || document.querySelector('button[type="submit"]') || document.querySelector('.send-btn');
  const chatInput = document.getElementById('chatInput') || document.querySelector('input[type="text"]') || document.querySelector('textarea');
  const responseBox = document.querySelector('.response-box') || document.getElementById('responseBox');
  const loadingIndicator = document.getElementById('loadingIndicator');

  if (sendButton && chatInput && responseBox && loadingIndicator) {
    sendButton.addEventListener('click', () => {
      const text = chatInput.value.trim();
      if (text) {
        loadingIndicator.style.display = 'block';
        setTimeout(() => {
          loadingIndicator.style.display = 'none';
        }, 1500); // Simulated delay for AI response processing

    });
  }
</script>

<script>
  // Chat Export Functionality
  const exportChatBtn = document.getElementById('exportChatBtn');
  if (exportChatBtn) {
    exportChatBtn.addEventListener('click', () => {
      const chatData = localStorage.getItem('mahlet_chat_history') || 'No chat history found.';
      const blob = new Blob([chatData], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mahlet-chat-export.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  // Theme Accent Toggle Functionality
  const themeBtns = document.querySelectorAll('.theme-btn');
  themeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const selectedColor = btn.getAttribute('data-color');
      document.documentElement.style.setProperty('--accent-color', selectedColor);
      // Apply subtle visual accent to interactive focus points
      document.querySelectorAll('button, input, textarea').forEach(el => {
        el.style.borderColor = selectedColor;
      });
    });
  });
</script>

<script>
  // Check if user is already registered
  const userProfile = localStorage.getItem('mahlet_user_profile');
  const modal = document.getElementById('welcomeModal');
  
  if (userProfile) {
    modal.style.display = 'none';
  }

  // Handle registration submission
  document.getElementById('userRegForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const profile = {
      name: document.getElementById('regName').value,
      email: document.getElementById('regEmail').value,
      age: document.getElementById('regAge').value,
      gender: document.getElementById('regGender').value,
      country: document.getElementById('regCountry').value
    };
    localStorage.setItem('mahlet_user_profile', JSON.stringify(profile));
    modal.style.display = 'none';
  });
</script>
<script>
  async function getRealAIResponse(userPrompt) {
    const apiKey = '';
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: userPrompt }] }]
        })
      });

      const data = await response.json();
      const aiText = data.candidates[0].content.parts[0].text;
      
      document.querySelector('.AI-response-box').innerText = aiText;
    } catch (error) {
      console.error('Error connecting to AI brain:', error);
      document.querySelector('.AI-response-box').innerText = 'Error loading response. Please check your API key.';
    }
  }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI 🌍</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; color: #fff; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; min-height: 100dvh; margin: 0; padding: 10px; 
        }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #181818; box-shadow: 4px 0 10px rgba(0,0,0,0.7); transition: left 0.3s ease; z-index: 1000; display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #333; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .close-sidebar { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        .temp-chat-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; background: #222; padding: 8px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
        .search-chats { width: 100%; padding: 7px; background: #252525; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 12px; margin-bottom: 10px; outline: none; }
        .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item { background: #222; padding: 8px; border-radius: 5px; font-size: 12px; cursor: pointer; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: #2a2a2a; color: #fff; }

        .chat-container { width: 100%; max-width: 650px; background: #1e1e1e; padding: 10px; display: flex; flex-direction: column; height: 85vh; border-radius: 8px; border: 1px solid #333; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .menu-btn, .top-btn { background: #333; color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        
        .welcome-text { font-size: 11px; color: #aaa; text-align: center; margin-bottom: 8px; line-height: 1.3; }
        
        .controls { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; font-size: 11px; background: #252525; padding: 6px; border-radius: 6px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: #fff; border: 1px solid #444; padding: 3px; border-radius: 4px; width: 65%; font-size: 11px; }
        
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 6px; border-radius: 8px; background: #181818; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; line-height: 1.4; font-size: 13px; padding: 8px 12px; border-radius: 10px; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #2b5278; color: #fff; }
        .message.ai { align-self: flex-start; background: #2a2a2a; color: #e5e5e5; border: 1px solid #333; }
        .message-header { font-size: 10px; font-weight: bold; margin-bottom: 3px; color: #aaa; text-transform: uppercase; }
        
        .input-area { display: flex; flex-direction: column; gap: 4px; }
        .file-indicator { font-size: 10px; color: #8ab4f8; padding-left: 4px; }
        .input-row { display: flex; gap: 4px; align-items: center; background: #252525; padding: 6px; border-radius: 8px; border: 1px solid #444; }
        input[type="text"]#user-input { flex: 1; padding: 6px; border: none; background: transparent; color: #fff; font-size: 13px; outline: none; }
        
        .action-btn { background: #333; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: none; color: white; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { background: #444; }
        .send-btn { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <!-- Sidebar with Search, Temporary Chat Checkbox & Recent Chats -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span><b>Global AI Menu</b></span>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <button style="background:#222; color:#fff; padding:8px; border:none; border-radius:6px; cursor:pointer; margin-bottom:8px;" onclick="startNewChat(); toggleSidebar();">＋ New Chat</button>
        
        <div class="temp-chat-toggle">
            <input type="checkbox" id="temp-chat-checkbox" />
            <label for="temp-chat-checkbox">Temporary Chat (No History)</label>
        </div>

        <input type="text" id="search-history" class="search-chats" placeholder="Search recent chats..." oninput="filterChatHistory()" />
        
        <div id="history-list" class="chat-history-list">
            <div class="history-item" onclick="loadChat('Welcome Chat')">Welcome Chat</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="top-bar">
            <button class="menu-btn" onclick="toggleSidebar()">☰ Menu</button>
            <h2 style="margin:0; font-size: 14px;">Global AI 🌍</h2>
            <button class="top-btn" onclick="startNewChat()">＋ New Chat</button>
        </div>
        
        <div class="welcome-text">
            Your AI for Learning, Creating, Researching & Getting Things Done.
        </div>
        
        <div class="controls">
            <div class="control-row">
                <label>AI Role:</label>
                <select id="mode-select">
                    <option value="coach">❤️ Supportive Companion</option>
                    <option value="mentor">📚 Academic Mentor</option>
                    <option value="expert">💡 Professional Expert</option>
                </select>
            </div>
            <div class="control-row">
                <label>Language (100+):</label>
                <select id="lang-select">
                    <option value="English">English</option>
                    <option value="Amharic">Amharic (አማርኛ)</option>
                    <option value="Spanish">Spanish (Español)</option>
                    <option value="French">French (Français)</option>
                    <option value="Arabic">Arabic (العربية)</option>
                    <option value="German">German (Deutsch)</option>
                    <option value="Mandarin">Mandarin (中文)</option>
                    <option value="Hindi">Hindi (हिन्दी)</option>
                    <option value="Swahili">Swahili (Kiswahili)</option>
                </select>
            </div>
        </div>

        <div id="chat-box">
            <div class="message ai">
                <div class="message-header">Global AI</div>
                Hello! I am ready. What would you like to discuss or work on today?
            </div>
        </div>
        
        <div class="input-area">
            <div id="file-indicator" class="file-indicator">No file attached</div>
            <div class="input-row">
                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelection(event)" />
                
                <button class="action-btn" title="Upload Image/Camera" onclick="triggerFileUpload('image/*')">📷</button>
                <button class="action-btn" title="Voice Input" onclick="toggleVoiceInput()">🎙️</button>
                <button class="action-btn" title="Attach Document" onclick="triggerFileUpload('*')">📎</button>
                <button class="action-btn" title="Read Aloud" onclick="speakLastMessage()">🔊</button>
                
                <input type="text" id="user-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendTextMessage();" />
                <button class="send-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let attachedFile = null;
        let chatHistoryData = ["Welcome Chat"];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function startNewChat() {
            document.getElementById('chat-box').innerHTML = '<div class="message ai"><div class="message-header">Global AI</div>New chat started! How can I help you today?</div>';
            clearAttachment();
        }

        function triggerFileUpload(acceptType) {
            const fileInput = document.getElementById('file-input');
            fileInput.accept = acceptType;
            fileInput.click();
        }

        function handleFileSelection(event) {
            const file = event.target.files[0];
            if (file) {
                attachedFile = file;
                document.getElementById('file-indicator').innerText = `Attached: ${file.name}`;
            }
        }

        function clearAttachment() {
            attachedFile = null;
            document.getElementById('file-indicator').innerText = 'No file attached';
            document.getElementById('file-input').value = '';
        }

        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Voice input is not supported on this browser.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = () => { document.getElementById('user-input').placeholder = "Listening..."; };
            recognition.onresult = (event) => {
                document.getElementById('user-input').value = event.results[0][0].transcript;
                document.getElementById('user-input').placeholder = "Type a message...";
            };
            recognition.onerror = () => { document.getElementById('user-input').placeholder = "Type a message..."; };
            recognition.onend = () => { document.getElementById('user-input').placeholder = "Type a message..."; };
            recognition.start();
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Stop previous speech
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        function speakLastMessage() {
            const messages = document.querySelectorAll('.message.ai');
            if (messages.length === 0) return;
            const lastText = messages[messages.length - 1].innerText.replace('GLOBAL AI', '').trim();
            speakText(lastText);
        }

        function addChatToHistory(title) {
            const isTempChecked = document.getElementById('temp-chat-checkbox').checked;
            if (isTempChecked) return; // Do not save history if temporary chat is active

            if (!chatHistoryData.includes(title)) {
                chatHistoryData.unshift(title);
                renderHistoryList(chatHistoryData);
            }
        }

        function renderHistoryList(items) {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerText = item;
                div.onclick = () => loadChat(item);
                listEl.appendChild(div);
            });
        }

        function filterChatHistory() {
            const query = document.getElementById('search-history').value.toLowerCase();
            const filtered = chatHistoryData.filter(item => item.toLowerCase().includes(query));
            renderHistoryList(filtered);
        }

        function loadChat(title) {
            toggleSidebar();
        }

        async function sendTextMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const modeSelect = document.getElementById('mode-select').value;
            const langSelect = document.getElementById('lang-select').value;
            const prompt = inputField.value.trim();
            
            if (!prompt && !attachedFile) return;

            addChatToHistory(prompt.slice(0, 25) || "File Chat");

            // Display User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            let displayContent = prompt;
            if (attachedFile) {
                displayContent += `<br><small>[File Attached: ${attachedFile.name}]</small>`;
            }
            userDiv.innerHTML = `<div class="message-header">You</div>${displayContent}`;
            chatBox.appendChild(userDiv);
            
            inputField.value = '';
            clearAttachment();
            chatBox.scrollTop = chatBox.scrollHeight;

            // Placeholder for AI thinking
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            aiDiv.innerHTML = `<div class="message-header">Global AI</div>Thinking...`;
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }],
                        mode: modeSelect,
                        language: langSelect
                    })
                });

                const data = await response.json();
                const replyText = data.reply || data.error || "Done!";
                aiDiv.innerHTML = `<div class="message-header">Global AI</div>${replyText}`;
                
                // Automatically speak the response aloud
                speakText(replyText);
            } catch (err) {
                const fallbackText = `I received your message: "${prompt}". (API connection active)`;
                aiDiv.innerHTML = `<div class="message-header">Global AI</div>${fallbackText}`;
                speakText(fallbackText);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

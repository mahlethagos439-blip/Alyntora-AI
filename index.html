<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Mahlet & Robert 🌍</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Sidebar Menu Styles */
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #181818; box-shadow: 4px 0 10px rgba(0,0,0,0.7); transition: left 0.3s ease; z-index: 1000; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sidebar-title { font-size: 18px; font-weight: bold; }
        .close-sidebar { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        .search-box { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 5px; font-size: 13px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .sidebar-nav { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .sidebar-item { background: #222; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #ddd; text-align: left; border: none; width: 100%; }
        .sidebar-item:hover { background: #333; }
        .recents-header { font-size: 12px; color: #888; margin-top: 5px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

        /* Main Chat Container - Fixed height and layout */
        .chat-container { width: 92%; max-width: 650px; background: #1e1e1e; padding: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 96vh; box-sizing: border-box; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-shrink: 0; }
        .menu-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .top-btn { background: #333; color: white; border: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 11px; }
        .top-btn:hover { background: #444; }
        
        .profile-container { display: flex; align-items: center; gap: 8px; }
        .profile-pic { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid #3b82f6; }

        /* Robert's Live Talking Avatar Face Section */
        .avatar-box { display: flex; flex-direction: column; align-items: center; background: #161616; padding: 6px; border-radius: 8px; border: 1px solid #333; margin-bottom: 4px; flex-shrink: 0; }
        .robert-face { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.3); transition: transform 0.1s ease; }
        .robert-face.speaking { animation: avatarPulse 0.4s infinite alternate; }
        @keyframes avatarPulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .mouth-indicator { margin-top: 3px; width: 20px; height: 6px; background: #444; border-radius: 4px; transition: all 0.1s ease; }
        .mouth-indicator.speaking { height: 12px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 6px #00ffcc; }
        .status-text { font-size: 10px; color: #00ffcc; margin-top: 1px; font-weight: bold; }

        .controls { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; font-size: 11px; background: #252525; padding: 5px; border-radius: 6px; flex-shrink: 0; }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: #fff; border: 1px solid #444; padding: 3px; border-radius: 4px; width: 60%; font-size: 11px; }
        
        /* Chat Box Bubble Interface - Scrollable */
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 6px; border-radius: 8px; background: #181818; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
        
        .message { display: flex; flex-direction: column; max-width: 80%; line-height: 1.4; font-size: 13px; padding: 8px 12px; border-radius: 10px; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #2b5278; color: #fff; border-bottom-right-radius: 2px; }
        .message.ai { align-self: flex-start; background: #2a2a2a; color: #e5e5e5; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .message-header { font-size: 10px; font-weight: bold; margin-bottom: 3px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Input Area - Pinned cleanly at bottom */
        .input-area { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .input-row { display: flex; gap: 5px; align-items: center; background: #252525; padding: 5px; border-radius: 8px; border: 1px solid #444; }
        input[type="text"]#user-input { flex: 1; padding: 7px; border: none; background: transparent; color: #fff; font-size: 13px; outline: none; min-width: 0; }
        .action-btn { background: #333; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; border: none; color: white; flex-shrink: 0; }
        .action-btn:hover { background: #444; }
        #mic-btn.listening { background: #dc3545; animation: pulse 1.5s infinite; }
        #record-btn.recording { background: #dc3545; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        input[type="file"] { display: none; }
        .send-btn { background: #3b82f6; color: white; border: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn:hover { background: #2563eb; }
        #file-indicator { font-size: 10px; color: #888; padding-left: 4px; }
    </style>
</head>

    <script>
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";

        let selectedFileBase64 = null;
        let chatHistory = [];
        let savedChatsList = [];
        let lastAiText = "";
        let isVoiceMode = false;
        let recognition = null;
        let isAiSpeaking = false;
        let mouthAnimationTimer = null;
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function filterRecents() {
            const query = document.getElementById('search-recents').value.toLowerCase();
            const recentsContainer = document.getElementById('recents-list');
            recentsContainer.innerHTML = '';
            
            const filtered = savedChatsList.filter(chat => chat.title.toLowerCase().includes(query));
            if (filtered.length === 0) {
                recentsContainer.innerHTML = '<span style="font-size: 12px; color: #666;">No matching chats</span>';
                return;
            }
            filtered.forEach((chat) => {
                const originalIndex = savedChatsList.indexOf(chat);
                const btn = document.createElement('button');
                btn.className = 'sidebar-item';
                btn.innerText = chat.title;
                btn.onclick = () => loadRecentChat(originalIndex);
                recentsContainer.appendChild(btn);
            });
        }

        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            const indicator = document.getElementById('file-indicator');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                indicator.innerText = `Attached: ${file.name} (Ready)`;
            } else {
                indicator.innerText = "No file attached";
                selectedFileBase64 = null;
            }
        }

        async function toggleAudioRecording() {
            const recordBtn = document.getElementById('record-btn');
            const indicator = document.getElementById('file-indicator');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        indicator.innerText = "Attached: Voice Note (Ready)";
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    indicator.innerText = "Recording... Tap again to stop.";
                } catch (err) {
                    alert("Microphone permission denied.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        }

        function start

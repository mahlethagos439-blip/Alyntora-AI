<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Mahlet 🌍</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 90%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 8px; margin-top: 20px; flex: 1; max-height: 85vh; }
        .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; font-size: 13px; background: #252525; padding: 10px; border-radius: 8px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        select { background: #333; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 5px; width: 60%; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #181818; display: flex; flex-direction: column; gap: 10px; }
        .input-area { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #444; background: #333; color: #fff; border-radius: 5px; outline: none; }
        .send-btn { background: #007bff; color: white; border: none; border-radius: 5px; padding: 12px 18px; cursor: pointer; font-size: 13px; }
        .send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>Global AI Mahlet 🌍</h2>
        
        <div class="controls">
            <div class="control-row">
                <label for="node-select">AI Role:</label>
                <select id="node-select">
                    <option value="coach">❤️ Best Friend & Supportive Coach</option>
                </select>
            </div>
        </div>

        <div id="chat-box">
            <div>Hey bestie! What's on your mind today? Tell me everything!</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button class="send-btn" id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function handleSend() {
            let rawText = userInput.value.trim();
            if (!rawText) return;

            // Display user message
            chatBox.innerHTML += `<div><b>You:</b> ${rawText}</div>`;
            userInput.value = '';

            // Fix common typos automatically (e.g. 'fad' -> 'bad', 'hii' -> 'hi')
            let text = rawText.toLowerCase();
            text = text.replace(/\bfad\b/g, 'bad');
            text = text.replace(/\bteh\b/g, 'the');
            text = text.replace(/\bhav\b/g, 'have');

            let reply = "";

            setTimeout(() => {
                if (text.includes('hi') || text.includes('hey') || text.includes('hello')) {
                    reply = "Hey bestie! So good to hear from you. How are you feeling right now?";
                } else if (text.includes('bad') || text.includes('sad') || text.includes('hard') || text.includes('problem')) {
                    reply = "Oh no, I'm so sorry you're having a rough time. I'm right here with you—do you want to vent about it or talk through how to fix it?";
                } else if (text.includes('happy') || text.includes('good') || text.includes('great')) {
                    reply = "Yay! That makes me so happy to hear! Tell me everything, what's making you smile today?";
                } else {
                    // Best friend chatty fallback responses
                    const friendReplies = [
                        "Aww I totally get what you mean! Tell me more about that, I'm listening.",
                        "For real? That's so interesting! What happened next?",
                        "I'm always here for you, bestie. How do you want to handle this?",
                        "That totally makes sense. You've got this, and I've got your back no matter what!"
                    ];
                    reply = friendReplies[Math.floor(Math.random() * friendReplies.length)];
                }

                chatBox.innerHTML += `<div><b>Best Friend AI:</b> ${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
